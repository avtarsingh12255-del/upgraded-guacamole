<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hit the Dummy</title>
<style>
:root{--bg:#f3ece0;--floor:#c9b79c;--ink:#2b2320;--panel:#fffaf1;--accent:#e4572e;--line:#d8cbb6;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#25201d;--floor:#3b322c;--ink:#f3e9dc;--panel:#332b26;--accent:#ff7a4d;--line:#4a3f37;color-scheme:dark}}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",sans-serif;display:flex;flex-direction:column;overflow:hidden;touch-action:none}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 14px;background:var(--panel);border-bottom:2px solid var(--line)}
header label{font-weight:700;font-size:14px}
#name,#name2{font:inherit;padding:6px 10px;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);width:140px}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
button{font:inherit;font-weight:700;font-size:14px;padding:8px 12px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
button:focus-visible,#name:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#meter{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700}
#bar{width:120px;height:12px;border-radius:8px;background:var(--line);overflow:hidden}
#fill{height:100%;width:0;background:var(--accent);transition:width .15s}
main{flex:1;position:relative;min-height:0}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#hint{position:absolute;left:14px;bottom:10px;font-size:13px;opacity:.7;pointer-events:none}
#shop,#codes{position:absolute;right:12px;top:12px;width:min(300px,calc(100% - 24px));max-height:calc(100% - 24px);overflow:auto;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:12px 14px;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.18);z-index:5}
#shop[hidden],#codes[hidden]{display:none}
#codes{right:auto;left:12px}
#codes h2{font-size:15px;margin:0 0 8px}
#codes p{margin:0 0 10px}
#codes .row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
#codes small{opacity:.75;display:block}
#shop h2{font-size:15px;margin:0 0 8px}
#shop h2:not(:first-child){margin-top:12px}
#shop .row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
#shop .own{font-weight:700;color:var(--accent)}
#shop .skins{display:flex;flex-wrap:wrap;gap:6px}
#shop button:disabled{opacity:.45;cursor:not-allowed}
#shop .tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
#shop .row{flex-wrap:wrap}
</style>
</head>
<body>
<header>
  <label for="name">Name</label>
  <input id="name" value="Dummy" maxlength="16" autocomplete="off">
  <input id="name2" value="Guy 2" maxlength="16" autocomplete="off" aria-label="Second guy name" hidden>
  <div id="meter">Coins <span id="coins">0</span> Hits <span id="hits">0</span><div id="bar"><div id="fill"></div></div></div>
  <div class="tools" role="group" aria-label="Tools">
    <button data-t="grab" aria-pressed="true">Grab</button>
    <button data-t="whack" aria-pressed="false">Whack</button>
    <button data-t="boom" aria-pressed="false">Boom</button>
    <button data-t="rocket" aria-pressed="false" hidden>Rocket</button>
    <button data-t="zap" aria-pressed="false" hidden>Zap</button>
    <button data-t="hammer" aria-pressed="false" hidden>Hammer</button>
    <button data-t="bowl" aria-pressed="false" hidden>Bowling ball</button>
    <button data-t="anvil" aria-pressed="false" hidden>Anvil</button>
    <button data-t="cracker" aria-pressed="false" hidden>Firecrackers</button>
    <button data-t="magnet" aria-pressed="false" hidden>Magnet</button>
    <button data-t="fan" aria-pressed="false" hidden>Fan</button>
    <button data-t="party" aria-pressed="false" hidden>Party popper</button>
    <button data-t="tramp" aria-pressed="false" hidden>Trampoline</button>
    <button data-t="cannon" aria-pressed="false" hidden>Cannon</button>
    <button data-t="rope" aria-pressed="false" hidden>Rope</button>
    <button data-t="cut" aria-pressed="false" hidden>Scissors</button>
    <button data-t="slap" aria-pressed="false" hidden>Slap</button>
    <button data-t="pillow" aria-pressed="false" hidden>Pillow</button>
    <button data-t="balloon" aria-pressed="false" hidden>Balloons</button>
    <button data-t="chop" aria-pressed="false" hidden>Karate chop</button>
    <button data-t="freeze" aria-pressed="false" hidden>Freeze ray</button>
    <button data-t="bolt" aria-pressed="false" hidden>Lightning</button>
    <button data-t="meteor" aria-pressed="false" hidden>Meteor</button>
    <button data-t="hole" aria-pressed="false" hidden>Black hole</button>
    <button data-t="flip" aria-pressed="false">Flip gravity</button>
    <button id="add">Add guy</button>
    <button id="rem">Remove guy</button>
    <button id="brawl" aria-pressed="false">Brawl</button>
    <button id="slow" aria-pressed="false">Slow-mo</button>
    <button id="chaos" aria-pressed="false">Chaos</button>
    <button id="snd" aria-pressed="false">Sound</button>
    <button id="chat" aria-pressed="true">Chat</button>
    <button id="codebtn" aria-expanded="false">Code names</button>
    <button id="shopbtn" aria-expanded="false">Shop</button>
    <button id="reset">Reset</button>
  </div>
</header>
<main><canvas id="c"></canvas><div id="hint">Hit him to earn coins, then spend them in the Shop.</div><div id="shop" hidden></div><div id="codes" hidden></div></main>
<script>
(function(){
var cv=document.getElementById('c'),ctx=cv.getContext('2d');
var W,H,dpr=1,tool='grab',g=0.5,hits=0,stress=0,FLOOR=70;
var nameEl=document.getElementById('name');
var P=[],S=[],fx=[];
function resize(){var r=cv.getBoundingClientRect();dpr=window.devicePixelRatio||1;W=r.width;H=r.height;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
function pt(x,y,m){P.push({x:x,y:y,px:x,py:y,m:m||1,rg:cur});return P.length-1}
function st(a,b,k){var dx=P[a].x-P[b].x,dy=P[a].y-P[b].y;S.push({a:a,b:b,l:Math.sqrt(dx*dx+dy*dy),k:k||1})}
function oldBuild(){
  P=[];S=[];var cx=W/2,cy=H*0.3,u=Math.min(W,H)/520;u=Math.max(0.7,Math.min(u,1.4));
  var head=pt(cx,cy-60*u,1.4),neck=pt(cx,cy-35*u),sl=pt(cx-22*u,cy-30*u),sr=pt(cx+22*u,cy-30*u),
  hip=pt(cx,cy+40*u,1.3),el=pt(cx-28*u,cy+5*u),er=pt(cx+28*u,cy+5*u),hl=pt(cx-32*u,cy+38*u),hr=pt(cx+32*u,cy+38*u),
  pl=pt(cx-14*u,cy+40*u),pr=pt(cx+14*u,cy+40*u),kl=pt(cx-16*u,cy+85*u),kr=pt(cx+16*u,cy+85*u),fl=pt(cx-18*u,cy+130*u),fr=pt(cx+18*u,cy+130*u);
  S.push();
  st(head,neck);st(neck,sl);st(neck,sr);st(sl,sr);st(sl,hip);st(sr,hip);st(neck,hip);
  st(sl,el);st(el,hl);st(sr,er);st(er,hr);
  st(hip,pl);st(hip,pr);st(pl,pr);st(pl,kl);st(kl,fl);st(pr,kr);st(kr,fr);
  st(head,sl,.5);st(head,sr,.5);st(neck,pl,.6);st(neck,pr,.6);
  window._ix={head:head,neck:neck,sl:sl,sr:sr,hip:hip,el:el,er:er,hl:hl,hr:hr,pl:pl,pr:pr,kl:kl,kr:kr,fl:fl,fr:fr,u:u};
}
function step(){
  var i,s,p;
  if(held&&(tool==='magnet'||tool==='fan'||tool==='hole')){
    for(i=0;i<P.length;i++){p=P[i];var hx=mx-p.x,hy=my-p.y,hd2=Math.sqrt(hx*hx+hy*hy)||1;
      if(tool==='magnet'&&hd2<340){p.x+=hx/hd2*0.8;p.y+=hy/hd2*0.8;p.px+=(p.x-p.px)*0.1}
      else if(tool==='hole'&&hd2<420){p.x+=hx/hd2*1.4-hy/hd2*0.7;p.y+=hy/hd2*1.4+hx/hd2*0.7;p.px+=(p.x-p.px)*0.05}
      else if(tool==='fan'&&hd2<360){var fw=(1-hd2/360)*1.1;p.x-=hx/hd2*fw;p.y-=hy/hd2*fw}}
    if(++hc%40===0)hit(1);
  }
  for(i=0;i<P.length;i++){p=P[i];if(rags[p.rg]&&rags[p.rg].frz>0){p.px=p.x;p.py=p.y;continue}var vx=(p.x-p.px)*0.995,vy=(p.y-p.py)*0.995;p.px=p.x;p.py=p.y;p.x+=vx;p.y+=vy+g*p.m*0.9*((rags[p.rg]&&rags[p.rg].bal)?0.25:1)}
  for(var it=0;it<6;it++){
    for(i=0;i<S.length;i++){s=S[i];var a=P[s.a],b=P[s.b],dx=b.x-a.x,dy=b.y-a.y,d=Math.sqrt(dx*dx+dy*dy)||.001,df=(d-s.l)/d*0.5*s.k;
      a.x+=dx*df;a.y+=dy*df;b.x-=dx*df;b.y-=dy*df}
    if(drag>=0){P[drag].x+=(mx-P[drag].x)*0.5;P[drag].y+=(my-P[drag].y)*0.5}
    for(i=0;i<P.length;i++){p=P[i];
      var fy=g>0?H-FLOOR:FLOOR;
      if(g>0&&p.y>fy){var bv=p.y-p.py;p.y=fy;p.x-=(p.x-p.px)*0.3;if(bv>4&&rags[p.rg]&&hasAb(rags[p.rg],'bouncy'))p.py=fy+bv*0.8}
      if(g<0&&p.y<fy){p.y=fy;p.x-=(p.x-p.px)*0.3}
      if(g>0&&p.y<10){p.y=10;} if(g<0&&p.y>H-10){p.y=H-10}
      if(p.x<10)p.x=10;if(p.x>W-10)p.x=W-10}
  }
}
function impulse(x,y,r,f,sk){
  var any=false;
  for(var i=0;i<P.length;i++){var p=P[i],dx=p.x-x,dy=p.y-y,d=Math.sqrt(dx*dx+dy*dy);
    if(d<r&&!(sk!==undefined&&p.rg===sk)&&!(rags[p.rg]&&hasAb(rags[p.rg],'ghost'))){var k=(1-d/r)*f/(d||1)*((rags[p.rg]&&hasAb(rags[p.rg],'robot'))?0.3:1);p.px-=dx*k;p.py-=dy*k;any=true;var rr=rags[p.rg];if(rr&&f>=12&&!hasAb(rr,'robot'))rr.stun=Math.max(rr.stun,Math.round(20+f));if(rr&&f>=6)rr.hurt=Math.max(rr.hurt||0,35)}}
  return any;
}
var coins=0,up={whack:0,boom:0,coin:0,rocket:0,zap:0,moon:0,hammer:0,bowl:0,anvil:0,cracker:0,magnet:0,fan:0,cannon:0,tramp:0,party:0,rope:0,cut:0,slap:0,pillow:0,chop:0,balloon:0,freeze:0,bolt:0,meteor:0,hole:0},skin=0,SKINS=[['#f08a4b','#d9622b'],['#5b9bd5','#3a6fa5'],['#7cc36e','#4f9a45'],['#b78ae0','#8656b5'],['#f2c94c','#c9a227'],['#f27eb0','#d4568a'],['#3fb8af','#2a8a83'],['#e5534b','#b83a33'],['#f4f4f4','#c9c9c9']];
function hit(n){hits+=n;coins+=Math.round(n*(1+up.coin));stress=Math.min(100,stress+n*6);document.getElementById('hits').textContent=hits;document.getElementById('fill').style.width=stress+'%';document.getElementById('coins').textContent=coins;shopDirty=true}
function spawn(x,y,n,col){for(var i=0;i<n;i++){var a=Math.random()*6.283,v=2+Math.random()*5;fx.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:1,c:col})}}
var mx=0,my=0,drag=-1,held=false,props=[],hc=0,rags=[],pads=[],shots=[],ropes=[],pend=null,bolts=[],balls=[],achDone={},chaos=false,cc=0,snd=false,chatOn=true,lastB=0,AC=null,savedOut=[],savedWp=[],cosOwn={},looks=[],cosAll=false,cosWp=true,sf=0,slow=false;
function pos(e){var r=cv.getBoundingClientRect();mx=e.clientX-r.left;my=e.clientY-r.top}
function nearest(x,y,r){var b=-1,bd=r*r;for(var i=0;i<P.length;i++){var dx=P[i].x-x,dy=P[i].y-y,d=dx*dx+dy*dy;if(d<bd){bd=d;b=i}}return b}
cv.addEventListener('pointerdown',function(e){
  pos(e);cv.setPointerCapture(e.pointerId);
  if(tool==='grab'){drag=nearest(mx,my,60)}
  else if(tool==='whack'){if(impulse(mx,my,70+up.whack*10,22+up.whack*7)){hit(1+up.whack);spawn(mx,my,10+up.whack*4,'#ffd23f');pop(mx,my,up.whack>2?'SMASH!':'POW!')}}
  else if(tool==='boom'){impulse(mx,my,240+up.boom*45,40+up.boom*9);hit(3+up.boom);spawn(mx,my,40+up.boom*10,'#ff7a4d');pop(mx,my,'BOOM!');shake=14+up.boom*3}
  else if(tool==='rocket'){if(nearest(mx,my,120)>=0){var dr=g>0?1:-1;for(var i=0;i<P.length;i++){P[i].py=P[i].y+dr*(26+Math.random()*4)}hit(2);spawn(mx,my,25,'#ffb347');pop(mx,my,'WHOOSH!')}}
  else if(tool==='zap'){if(nearest(mx,my,120)>=0){for(var j=0;j<P.length;j++){P[j].px+=(Math.random()-.5)*28;P[j].py+=(Math.random()-.5)*28}hit(2);spawn(mx,my,30,'#7fd4ff');pop(mx,my,'ZAP!');shake=8}}
  else if(tool==='hammer'){if(impulse(mx,my,80,36)){hit(3);spawn(mx,my,18,'#ffd23f');pop(mx,my,'BONK!');shake=6}}
  else if(tool==='bowl'||tool==='anvil'){if(props.length<4){props.push({k:tool,x:mx,y:g>0?-40:H+40,vx:0,vy:0,r:tool==='bowl'?24:26,m:tool==='bowl'?1:1.6,cd:0,life:0})}}
  else if(tool==='cracker'){for(var c=0;c<6;c++){var cx2=mx+(Math.random()-.5)*90,cy2=my+(Math.random()-.5)*90;if(impulse(cx2,cy2,50,14))hit(1);spawn(cx2,cy2,8,'#ffd23f');pop(cx2,cy2,'pop')}}
  else if(tool==='magnet'||tool==='fan'||tool==='hole'){held=true}
  else if(tool==='party'){['#ff5e5e','#ffd23f','#6ec1e4','#7cc36e','#b78ae0'].forEach(function(c){spawn(mx,my,14,c)});impulse(mx,my,170,10);hit(2);pop(mx,my,'PARTY!')}
  else if(IT[tool]){var q2=IT[tool];if(impulse(mx,my,q2[0],q2[1])){hit(q2[2]);spawn(mx,my,12,q2[4]);pop(mx,my,q2[3]);shake=q2[5]}}
  else if(tool==='bolt'){bolts.push({x:mx,y:my,life:10,seed:Math.random()});impulse(mx,my,110,26);hit(4);spawn(mx,my,24,'#fff27a');pop(mx,my,'ZAP!!');shake=10}
  else if(tool==='meteor'){shots.push({x:mx-120,y:-30,vx:2.6,vy:9,own:-1,t:'rocket',g:0.05,life:0});pop(mx-120,40,'INCOMING!')}
  else if(tool==='balloon'){var bi=nearest(mx,my,70);if(bi>=0){balls.push({idx:bi});if(balls.length>24)balls.shift();pop(mx,my,'UP!')}}
  else if(tool==='freeze'){var fi=nearest(mx,my,80),fr=fi>=0?rags[P[fi].rg]:null;if(fr){fr.frz=240;spawn(mx,my,16,'#aee6ff');pop(mx,my,'BRRR!');hit(2)}}
  else if(tool==='rope'){var ni=nearest(mx,my,60),p2=ni>=0?{idx:ni}:{x:mx<40?6:(mx>W-40?W-6:mx),y:my};
    if(!pend){pend=p2}
    else if(pend.idx===undefined&&p2.idx===undefined){pop(mx,my,'Pick a guy!')}
    else if(pend.idx!==undefined&&p2.idx===pend.idx){pend=null}
    else{addRope(pend,p2);pend=null;hit(1)}}
  else if(tool==='cut'){var cb=-1,cd=1200;ropes.forEach(function(rp,ri){rp.nodes.forEach(function(nd){var dx=nd.x-mx,dy=nd.y-my,dd=dx*dx+dy*dy;if(dd<cd){cd=dd;cb=ri}})});if(cb>=0){ropes.splice(cb,1);refreshRoped();pop(mx,my,'SNIP!')}}
  else if(tool==='tramp'){if(pads.length>=3)pads.shift();pads.push({x:mx,y:g>0?H-FLOOR:FLOOR,w:110,cd:0})}
  else if(tool==='cannon'){if(props.length<6){var fromL=mx<W/2;props.push({k:'bowl',x:fromL?26:W-26,y:my,vx:fromL?18:-18,vy:-1,r:22,m:0.2,cd:0,life:0});pop(fromL?60:W-60,my,'FIRE!');shake=5}}
});
cv.addEventListener('pointermove',function(e){pos(e)});
cv.addEventListener('pointerup',function(){if(drag>=0){hit(1)}drag=-1;held=false});
cv.addEventListener('pointercancel',function(){drag=-1;held=false});
var pops=[],shake=0;
function pop(x,y,t){pops.push({x:x,y:y,t:t,life:1});var nw=Date.now();if(nw-lastB>70){lastB=nw;beep(200+Math.random()*300,0.08)}}
document.querySelectorAll('.tools button[data-t]').forEach(function(b){b.addEventListener('click',function(){
  var t=b.dataset.t;
  if(t==='flip'){g=-g;return}
  tool=t;pend=null;document.querySelectorAll('.tools button[data-t]').forEach(function(o){o.setAttribute('aria-pressed',o===b?'true':'false')})
})});
document.getElementById('reset').addEventListener('click',function(){g=Math.abs(g);props=[];pads=[];shots=[];rebuild();hits=0;stress=0;document.getElementById('hits').textContent=0;document.getElementById('fill').style.width='0'});
function line(a,b,w,c){ctx.strokeStyle=c;ctx.lineWidth=w;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(P[a].x,P[a].y);ctx.lineTo(P[b].x,P[b].y);ctx.stroke()}
function draw(){
  var cs=getComputedStyle(document.documentElement),ink=STG[stg][3]==='auto'?cs.getPropertyValue('--ink').trim():STG[stg][3],fl=cs.getPropertyValue('--floor').trim();
  ctx.save();
  if(shake>0){ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=0.85;if(shake<.5)shake=0}
  ctx.clearRect(-20,-20,W+40,H+40);
  ctx.fillStyle=fl;ctx.fillRect(0,H-FLOOR+8,W,FLOOR);ctx.fillRect(0,0,W,FLOOR-62);
  for(var ri=0;ri<rags.length;ri++){var x=rags[ri],u=x.u,sk=hasAb(x,'zombie')?ZSK:SKINS[x.id===0?skin:x.sk],body=sk[0],limb=sk[1];ctx.globalAlpha=hasAb(x,'ghost')?0.5:1;
  drawBack2(x,u,ink);
  if(x.acc.back==='wings'){ctx.fillStyle='#fff';ctx.strokeStyle=ink;ctx.lineWidth=2.5;[[P[x.sl],-1],[P[x.sr],1]].forEach(function(w){var q=w[0];ctx.beginPath();ctx.moveTo(q.x,q.y);ctx.quadraticCurveTo(q.x+w[1]*60*u,q.y-50*u,q.x+w[1]*70*u,q.y+10*u);ctx.quadraticCurveTo(q.x+w[1]*35*u,q.y+5*u,q.x,q.y+25*u);ctx.closePath();ctx.fill();ctx.stroke()})}
  if(x.acc.back==='pack'){var pa=P[x.neck],pb=P[x.hip];ctx.fillStyle='#2d8f5b';ctx.strokeStyle=ink;ctx.lineWidth=2.5;ctx.fillRect((pa.x+pb.x)/2-19*u,(pa.y+pb.y)/2-14*u,38*u,34*u);ctx.strokeRect((pa.x+pb.x)/2-19*u,(pa.y+pb.y)/2-14*u,38*u,34*u)}
  if(x.acc.back==='cape'){ctx.fillStyle='#c0392b';ctx.beginPath();ctx.moveTo(P[x.sl].x,P[x.sl].y);ctx.lineTo(P[x.sr].x,P[x.sr].y);ctx.lineTo(P[x.hip].x+36*u,P[x.hip].y+34*u);ctx.lineTo(P[x.hip].x-36*u,P[x.hip].y+34*u);ctx.closePath();ctx.fill()}
  line(x.hip,x.pl,12*u,limb);line(x.hip,x.pr,12*u,limb);
  line(x.pl,x.kl,11*u,limb);line(x.kl,x.fl,10*u,ink);line(x.pr,x.kr,11*u,limb);line(x.kr,x.fr,10*u,ink);
  line(x.sl,x.el,9*u,limb);line(x.el,x.hl,8*u,ink);line(x.sr,x.er,9*u,limb);line(x.er,x.hr,8*u,ink);
  line(x.neck,x.hip,26*u,body);line(x.sl,x.sr,16*u,body);drawWp(x,ink);drawAccBody(x,u,ink);
  var h=P[x.head],nk=P[x.neck],ang=Math.atan2(h.y-nk.y,h.x-nk.x)-Math.PI/2*0;
  ctx.fillStyle='#f6d3a8';ctx.strokeStyle=ink;ctx.lineWidth=3;
  ctx.beginPath();ctx.arc(h.x,h.y,24*u,0,6.283);ctx.fill();ctx.stroke();
  var dx=Math.cos(ang+Math.PI/2),dy=Math.sin(ang+Math.PI/2),ex=-dy,ey=dx;

  ctx.strokeStyle=ink;ctx.lineWidth=wd+4;ctx.beginPath();ctx.moveTo(h.x,h.y);ctx.lineTo(tx,ty);ctx.stroke();
  ctx.strokeStyle=W2[2];ctx.lineWidth=wd;ctx.beginPath();ctx.moveTo(h.x,h.y);ctx.lineTo(tx,ty);ctx.stroke();
  if(x.wp==='pan'){ctx.fillStyle='#555';ctx.beginPath();ctx.arc(tx+ux*12*u,ty+uy*12*u,15*u,0,6.283);ctx.fill();ctx.strokeStyle=ink;ctx.lineWidth=3;ctx.stroke()}
  if(x.wp==='sling'){ctx.strokeStyle=ink;ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(tx,ty);ctx.lineTo(tx+ux*12*u-uy*9*u,ty+uy*12*u+ux*9*u);ctx.moveTo(tx,ty);ctx.lineTo(tx+ux*12*u+uy*9*u,ty+uy*12*u-ux*9*u);ctx.stroke()}
  if(x.wp==='mallet'||x.wp==='chicken'||x.wp==='racket'){ctx.save();ctx.translate(tx,ty);ctx.rotate(Math.atan2(uy,ux));ctx.lineWidth=3;ctx.strokeStyle=ink;
    if(x.wp==='mallet'){ctx.fillStyle='#7a7f87';ctx.fillRect(-4*u,-15*u,22*u,30*u);ctx.strokeRect(-4*u,-15*u,22*u,30*u)}
    else if(x.wp==='chicken'){ctx.fillStyle='#f5d742';ctx.beginPath();ctx.ellipse(10*u,0,14*u,10*u,0,0,6.283);ctx.fill();ctx.stroke();ctx.fillStyle='#e4572e';ctx.beginPath();ctx.moveTo(22*u,-3*u);ctx.lineTo(30*u,0);ctx.lineTo(22*u,3*u);ctx.fill()}
    else{ctx.fillStyle='rgba(255,255,255,.5)';ctx.beginPath();ctx.ellipse(14*u,0,16*u,12*u,0,0,6.283);ctx.fill();ctx.stroke()}
    ctx.restore()}
}
var addBtn=document.getElementById('add'),remBtn=document.getElementById('rem'),brawlBtn=document.getElementById('brawl'),shopDirty=false,wsel=0;

function nearestFoe(r){if(!brawl)return null;var b=null,bd=1e9;rags.forEach(function(q){if(q!==r&&q.hp>0){var d=Math.abs(P[q.hip].x-P[r.hip].x);if(d<bd){bd=d;b=q}}});return b}
function guyName(r){return r.id===0?((nameEl.value||'').trim().slice(0,10)||'Guy 1'):'Guy '+(r.id+1)}
var FACES=[['auto','Auto'],['happy','Happy'],['angry','Angry'],['scared','Scared'],['silly','Silly'],['sleepy','Sleepy'],['sad','Sad']];
function renderFaces(tabs){
  if(wsel>=rags.length)wsel=0;

function drawFace(x,u,ink){
  var m=x.mood||'happy',t=x.t||0,ey=-3*u,ex=9*u;
  ctx.strokeStyle=ink;ctx.fillStyle=ink;ctx.lineWidth=2.6;ctx.lineCap='round';
  function eye(s,k){var cx=s*ex,d=3.5*u;ctx.fillStyle=ink;ctx.strokeStyle=ink;ctx.beginPath();
    if(k==='dot'){ctx.arc(cx,ey,3*u,0,6.283);ctx.fill()}
    else if(k==='wide'){ctx.fillStyle='#fff';ctx.arc(cx,ey,5.5*u,0,6.283);ctx.fill();ctx.stroke();ctx.fillStyle=ink;ctx.beginPath();ctx.arc(cx,ey,1.8*u,0,6.283);ctx.fill()}
    else if(k==='x'){ctx.moveTo(cx-d,ey-d);ctx.lineTo(cx+d,ey+d);ctx.moveTo(cx+d,ey-d);ctx.lineTo(cx-d,ey+d);ctx.stroke()}
    else if(k==='line'){ctx.moveTo(cx-4*u,ey);ctx.lineTo(cx+4*u,ey);ctx.stroke()}
    else if(k==='pain'){ctx.moveTo(cx+s*3*u,ey-3*u);ctx.lineTo(cx-s*2*u,ey);ctx.lineTo(cx+s*3*u,ey+3*u);ctx.stroke()}
    else if(k==='spiral'){for(var a=0;a<12;a+=0.4){var rr=0.35*a*u,px=cx+Math.cos(a+t*0.2*s)*rr,py=ey+Math.sin(a+t*0.2*s)*rr;if(a===0)ctx.moveTo(px,py);else ctx.lineTo(px,py)}ctx.stroke()}
  }
  function brow(a,b,c,d){ctx.strokeStyle=ink;ctx.beginPath();ctx.moveTo(a*u,b*u);ctx.lineTo(c*u,d*u);ctx.stroke()}
  function smile(r){ctx.strokeStyle=ink;ctx.beginPath();ctx.arc(0,2*u,r*u,0.25,2.89);ctx.stroke()}
  function tongue(){ctx.fillStyle='#e17055';ctx.beginPath();ctx.arc(3*u,10*u,3.5*u,0,Math.PI);ctx.fill();ctx.strokeStyle=ink;ctx.stroke()}
  function drop(px,py){ctx.fillStyle='#7fd4ff';ctx.beginPath();ctx.arc(px*u,py*u,2.5*u,0,6.283);ctx.fill()}
  var bl=(t%200<6)?'line':'dot';
  if(m==='happy'){eye(-1,bl);eye(1,bl);smile(9)}
  else if(m==='ouch'){eye(-1,'pain');eye(1,'pain');ctx.fillStyle=ink;ctx.beginPath();ctx.arc(0,9*u,6*u,0,Math.PI);ctx.closePath();ctx.fill()}
  else if(m==='dizzy'){eye(-1,'spiral');eye(1,'spiral');ctx.strokeStyle=ink;ctx.beginPath();ctx.moveTo(-8*u,10*u);ctx.quadraticCurveTo(-4*u,6*u,0,10*u);ctx.quadraticCurveTo(4*u,14*u,8*u,10*u);ctx.stroke()}
  else if(m==='scared'){eye(-1,'wide');eye(1,'wide');brow(-14,-13,-5,-15);brow(5,-15,14,-13);ctx.fillStyle=ink;ctx.beginPath();ctx.arc(0,11*u,4*u,0,6.283);ctx.fill();drop(18,-8)}
  else if(m==='angry'){eye(-1,'dot');eye(1,'dot');brow(-14,-12,-4,-7);brow(4,-7,14,-12);ctx.strokeStyle=ink;ctx.beginPath();ctx.arc(0,16*u,8*u,Math.PI*1.2,Math.PI*1.8);ctx.stroke()}
  else if(m==='ko'){eye(-1,'x');eye(1,'x');ctx.strokeStyle=ink;ctx.beginPath();ctx.moveTo(-6*u,9*u);ctx.lineTo(6*u,9*u);ctx.stroke();tongue()}
  else if(m==='silly'){eye(-1,'dot');eye(1,'wide');smile(9);tongue()}
  else if(m==='sleepy'){eye(-1,'line');eye(1,'line');ctx.strokeStyle=ink;ctx.beginPath();ctx.arc(0,11*u,2.5*u,0,6.283);ctx.stroke();ctx.fillStyle=ink;ctx.font='700 '+Math.round(11*u)+'px "Trebuchet MS",sans-serif';ctx.textAlign='center';ctx.fillText('z',18*u,-14*u)}
  else if(m==='sad'){eye(-1,'dot');eye(1,'dot');brow(-13,-8,-5,-12);brow(5,-12,13,-8);ctx.strokeStyle=ink;ctx.beginPath();ctx.arc(0,16*u,6*u,Math.PI*1.2,Math.PI*1.8);ctx.stroke();drop(-9,5)}
}

var STG=[['Sunny room','','','auto',0],['Night','#1f2a44','#34436b','#f3e9dc',30],['Beach','#bfe6f2','#e8d9a8','#2b2320',30],['Space','#0f0f1f','#2a2a40','#f3e9dc',50],['Lava','#3a1a14','#7a2b1c','#f3e9dc',50],['Snow','#e8f0f7','#ffffff','#2b2320',40],['Sunset','#f6b26b','#8e5a3c','#2b2320',40],['Jungle','#2f5d3a','#4b3a22','#f3e9dc',45],['Neon','#12091f','#ff2e97','#f3e9dc',60]],stgOwn=[1,0,0,0,0,0,0,0,0],stg=0;
